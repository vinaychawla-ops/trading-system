# Long-term growth profile, daily bars, US equities/ETFs.
profile:
  name: growth_daily
  universe:
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - META
    - GOOGL
    - AVGO
    - TSLA
    - BRK-B
    - JPM
    - V
    - JNJ
    - XOM
    - UNH
    - MA
    - PG
    - LLY
    - HD
    - MRK
    - ABBV
    - COST
    - PEP
    - CVX
    - WMT
    - BAC
    - KO
    - CSCO
    - ADBE
    - CRM
    - NFLX
    - AMD
    - QCOM
    - TXN
    - HON
    - AMGN
    - DIS
    - PFE
    - QQQ
    - GLD
    - SPY

train_start: "2010-01-01"
train_end: "2022-12-31"
test_start: "2023-01-01"  # sealed until Phase 3 validation

cache_dir: "data/cache"
results_dir: "results"

costs:
  commission_bps: 1.0
  slippage_bps: 5.0

criteria:
  min_trades: 30
  min_sharpe: 0.5
  # 2026-09-18: raised 0.15 -> 0.25 per Vin -- the 15% cap bound on everything
  # including the core (QQQ/GLD rotation runs ~30% max DD on COVID).
  max_drawdown: 0.25
  must_beat_benchmark: true
  # 2026-09-18: judge the benchmark on risk-adjusted returns (Sharpe), not raw
  # total return -- beating QQQ's 2010-2022 raw run while capping drawdown at
  # 15% proved self-contradictory (0/157 tests passed).
  beat_benchmark_on: sharpe
  max_pairwise_corr: 0.7

# Keep grids small: 2-4 values per param so runs finish quickly.
param_grids:
  trend_pullback:
    lookback: [50, 200]
    rsi_window: [2, 5]
    rsi_thresh: [20, 30]
    hold_days: [5, 10]
    max_positions: [5]
  low_range_close:
    lookback: [50, 200]
    range_window: [10, 20]
    pct: [0.1, 0.25]
    hold_days: [5, 10]
    max_positions: [5]
  quiet_pullback:
    lookback: [50, 200]
    pullback_days: [3, 4]
    range_atr_frac: [0.5, 1.0]
    hold_days: [5, 10]
    max_positions: [5]

mutate:
  n_rounds: 2
  n_children: 6
  perturb: 0.25
  top_k: 3
  seed: 42

# Phase 3: out-of-sample validation on sealed test data.
validate:
  warmup_days: 300  # calendar-day buffer before test_start, indicator warmup only (never scored)

# Phase 3: walk-forward sleeve repick.
walkforward:
  start: "2018-01-01"
  rebalance: quarterly
  selection_lookback_years: 5
  top_k: 3
  kill_dd_multiple: 2.0
  warmup_days: 300
  # Smaller override grid for the per-rebalance selection (keeps runtime sane).
  walkforward_grid:
    trend_pullback:
      lookback: [50, 200]
      rsi_window: [2]
      rsi_thresh: [20, 30]
      hold_days: [5]
      max_positions: [5]
    low_range_close:
      lookback: [50, 200]
      range_window: [10]
      pct: [0.1, 0.25]
      hold_days: [5]
      max_positions: [5]
    quiet_pullback:
      lookback: [50, 200]
      pullback_days: [3]
      range_atr_frac: [0.5, 1.0]
      hold_days: [5]
      max_positions: [5]

# Phase 3: portfolio assembly.
portfolio:
  core_weight: 0.7
  sleeve_weight: 0.3
  max_pairwise_corr: 0.7
  sleeve_source: walkforward  # or: validated

# Core strategy parameters (defaults shown; empty section also means defaults).
core:
  risky: QQQ
  safe: GLD
  ma: 200

# Phase 3: risk sizing -- the three user levers.
risk:
  max_loss_per_trade: 500.0   # dollars: most one trade may lose
  capital_at_risk: 80000.0    # dollars: cap on total market exposure
  leverage_ceiling: 1.0       # 1.0 = no leverage; borrowing accrues below
  borrow_rate_annual: 0.05
  default_stop_pct: 0.08      # assumption: strategies emit no stops
